name: Project CI with Maven

on:
  push:
    branches: [ "full_app" ]
  pull_request:
    branches: [ "full_app" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: xvfb-run -a mvn --batch-mode clean test
