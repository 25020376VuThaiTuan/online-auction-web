name: Project CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Chèn thêm bước này để cài đặt xvfb vào hệ thống
      - name: Install xvfb (Virtual Display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # Bước chạy test của bạn giữ nguyên, lúc này xvfb-run mới có hiệu lực
      - name: Build and test
        run: xvfb-run -a mvn --batch-mode clean verify
